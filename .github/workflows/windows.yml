name: Windows

# Builds the Tauri NSIS installer in win/ on a Windows runner.
# Tag pushes (or workflow_dispatch with a tag) upload KeyCat-Windows-Setup.exe (+ .sha256,
# plus latest.json / latest.yml when TAURI_SIGNING_PRIVATE_KEY is configured).
on:
  push:
    branches: [main]
    paths:
      - 'win/**'
      - 'web/**'
      - '.github/workflows/windows.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'win/**'
      - 'web/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload (e.g. v1.1.1); leave empty to build current branch only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: win/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: win

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match win/package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run dist
          else
            npm run dist -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Collect release files
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          cp target/release/bundle/nsis/KeyCat_"$version"_x64-setup.exe out/KeyCat-Windows-Setup.exe
          (cd out && sha256sum KeyCat-Windows-Setup.exe | tee KeyCat-Windows-Setup.exe.sha256)
          ls -lh out
          [ -f target/release/bundle/nsis/KeyCat_"$version"_x64-setup.exe.sig ] || exit 0
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version/KeyCat-Windows-Setup.exe"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$version" URL="$url" DATE="$date" \
          SIG="$(cat target/release/bundle/nsis/KeyCat_"$version"_x64-setup.exe.sig)" \
          node -e '
            const fs = require("fs");
            const { VERSION, URL, DATE, SIG } = process.env;
            fs.writeFileSync("out/latest.json", JSON.stringify({
              version: VERSION,
              pub_date: DATE,
              platforms: { "windows-x86_64": { signature: SIG, url: URL } },
            }, null, 2));
            const exe = fs.readFileSync("out/KeyCat-Windows-Setup.exe");
            const sha512 = require("crypto").createHash("sha512").update(exe).digest("base64");
            fs.writeFileSync("out/latest.yml", [
              `version: ${VERSION}`,
              "files:",
              "  - url: KeyCat-Windows-Setup.exe",
              `    sha512: ${sha512}`,
              `    size: ${exe.length}`,
              "path: KeyCat-Windows-Setup.exe",
              `sha512: ${sha512}`,
              `releaseDate: '\''${DATE}'\''`,
              "",
            ].join("\n"));
          '
          cat out/latest.json out/latest.yml

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          [ -n "$TAG" ] || exit 0
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          FILES=(out/KeyCat-Windows-Setup.exe out/KeyCat-Windows-Setup.exe.sha256)
          [ -f out/latest.json ] && FILES+=(out/latest.json)
          [ -f out/latest.yml ] && FILES+=(out/latest.yml)
          gh release upload "$TAG" "${FILES[@]}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: keycat-windows
          path: win/out/*
          if-no-files-found: error
