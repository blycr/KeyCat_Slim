name: Release Windows

# Manual fallback workflow: Windows builds and NSIS releases are normally produced locally.
# Trigger via workflow_dispatch only when a cloud Windows build is explicitly needed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload (e.g. v2.2.1); leave empty to build current branch only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches Cargo.toml workspace version
        if: startsWith(inputs.tag, 'v')
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$INPUT_TAG" != "v$version" ]; then
            echo "tag $INPUT_TAG does not match Cargo.toml workspace version $version" >&2
            exit 1
          fi

      - name: Run core tests
        run: cargo test -p keycat-core

      - name: Build native release binary
        run: cargo build --release -p keycat-native

      - name: Build NSIS installer
        run: |
          if command -v makensis >/dev/null 2>&1; then
            MAKENSIS="makensis"
          elif [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          else
            choco install nsis -y --no-progress
            MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          mkdir -p out
          VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          EXE_WIN="$(cygpath -w "$PWD/target/release/KeyCat.exe")"
          OUT_WIN="$(cygpath -w "$PWD/out/KeyCat-Windows-Setup.exe")"
          "$MAKENSIS" -INPUTCHARSET UTF8 -DVERSION="$VERSION" -DEXE_PATH="$EXE_WIN" -DOUT_FILE="$OUT_WIN" apps/windows/installer.nsi
          (cd out && sha256sum KeyCat-Windows-Setup.exe | tee KeyCat-Windows-Setup.exe.sha256)
          ls -lh out

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          [ -n "$TAG" ] || exit 0
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            out/KeyCat-Windows-Setup.exe \
            out/KeyCat-Windows-Setup.exe.sha256 \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: keycat-windows
          path: out/*
          if-no-files-found: error
