name: macOS

# Builds the universal native Metal macOS app (native/mac + native/ffi, zero WebKit),
# runs FFI + offscreen Metal smoke tests, and uploads KeyCat-macOS.zip on tag pushes.
on:
  push:
    branches: [main]
    paths:
      - 'native/core/**'
      - 'native/ffi/**'
      - 'native/mac/**'
      - 'native/Cargo.*'
      - '.github/workflows/macos.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'native/core/**'
      - 'native/ffi/**'
      - 'native/mac/**'
      - 'native/Cargo.*'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload (e.g. v2.1.0); leave empty to build current branch only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check that the tag matches native/mac/Info.plist
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/mac/Info.plist)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match native/mac/Info.plist version $version" >&2
            exit 1
          fi

      - name: Run Rust core & FFI unit tests
        run: cargo test --manifest-path native/Cargo.toml -p keycat-core -p keycat-ffi

      - name: Build and package universal native Metal macOS app
        run: |
          sh native/mac/package.sh
          # Verify zero WebKit linkage and universal arm64 + x86_64 slices
          lipo -info build/KeyCat.app/Contents/MacOS/KeyCat
          otool -L build/KeyCat.app/Contents/MacOS/KeyCat
          if otool -L build/KeyCat.app/Contents/MacOS/KeyCat | grep -qi WebKit; then
            echo "Unexpected WebKit linkage detected!" >&2
            exit 1
          fi

      - name: Run native FFI & Metal smoke test
        run: |
          build/KeyCat.app/Contents/MacOS/KeyCat --smoke-test dist/smoke.png
          ls -lh dist

      - name: Verify Homebrew Cask syntax
        run: |
          brew tap blycr/tap https://github.com/blycr/homebrew-tap
          brew info --cask blycr/tap/keycat
          brew style blycr/tap/keycat

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          [ -n "$TAG" ] || exit 0
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            dist/KeyCat-macOS.zip \
            dist/KeyCat-macOS.zip.sha256 \
            dist/latest-mac.json \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: keycat-macos
          path: dist/*
          if-no-files-found: error
