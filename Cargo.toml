[workspace]
members = [
  "crates/core",
  "crates/ffi",
  "apps/windows",
]
resolver = "2"

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/blycr/KeyCat_Slim"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
